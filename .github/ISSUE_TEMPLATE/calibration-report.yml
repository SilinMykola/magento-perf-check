name: Calibration report
description: Findings of magento-perf-check on your project, with your verdicts, to measure how precise the rules are.
title: "Calibration report: "
labels: ["calibration"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. The steps are in [Help calibrate the rules](https://github.com/SilinMykola/magento-perf-check/blob/main/docs/calibration-reports.md).

        **This issue is public as soon as you post it, and it shows your GitHub account.** Do not paste code, paths, module names or anything else you cannot make public; counts and verdicts with a short reason are enough. To send a report privately, see the guide.
  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: I may share what I post here, and it may be used and published in a calibration round.
          required: true
  - type: input
    id: magento
    attributes:
      label: Magento versions and editions
      placeholder: "2.4.7-p3, Open Source"
    validations:
      required: true
  - type: dropdown
    id: storefront
    attributes:
      label: Storefront
      options:
        - Luma or a Luma-based theme
        - Hyvä
        - Headless (PWA, other)
        - Other or not sure
    validations:
      required: true
  - type: textarea
    id: counts
    attributes:
      label: Calibration summary
      description: "Paste calibration-summary.md, made by resources/calibration-summary.php from your report (see the guide). Never paste the report itself: it holds your paths."
      render: text
    validations:
      required: true
  - type: textarea
    id: verdicts
    attributes:
      label: Verdicts
      description: "Only if they are not in the summary above: rule ID, TP, TP-low, FP or unclear, and a short reason, without names or paths."
      placeholder: |
        P-LOOP-01 | TP | product load per cart item on the cart page
        X-LAY-01 | FP | the block is only on the customer's order page
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Rules that missed something you know is there, false positives that repeat, problems running the tool. Do not paste code of a project here; send code for a false positive privately, as the guide says.
